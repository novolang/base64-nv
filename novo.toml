[package]
name        = "base64-nv"
version     = "0.1.1"
description = "RFC 4648 base64 as a @value state machine: both alphabets, padded and unpadded, encode into a buffer the caller already owns, and decode with a refusal that names the character and the offset.  The standard library's base64 is a host C symbol; this one is arithmetic, and it compiles for a microcontroller."
license     = "Apache-2.0"

# `experimental` because no program outside this repository has used the
# package yet, and the tests were written against the signatures rather
# than by a consumer.
stability   = "experimental"

# `core`: a table lookup and three shifts over bytes the caller already
# holds.  No function declares an effect.
#
# It carries `tests/embedded_probe.nv`, which builds `base64_core` for a
# Cortex-M4 and checks four answers on it under QEMU.  Running on a
# device is why the package exists beside `std.codec`: `bytes.to_base64`
# is an extern over a host C symbol, and a device that called it would
# fail at the linker.
#
# `tests/alloc_scan.sh` reads the emitted LLVM for the other half of
# that: all fourteen functions of `base64_core` appear in the IR at
# `--opt=0` and none of them calls the allocator.
layer       = "core"

category    = "encoding"

tags        = ["base64", "base64url", "rfc4648", "encoding", "embedded", "no-alloc", "sans-io"]
repository  = "https://github.com/novolang/base64-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.8.9"

[docs.pages]
"README.md" = "Six bits at a time, on a device or on a host"

[dependencies]
# None, and bitstream-nv is the one a reader would expect to see here.
# base64's group is a fixed twenty-four bits and its alphabet is a table
# lookup, so a general variable-width bit reader would be slower.  It
# would also cost the build for a device, which is made from the
# package's own core modules and nothing they depend on.  The README
# says so where a reader will look for it.
